<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>07 BET | Admin</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; margin: 0; }
        .sidebar { width: 220px; background: #0f2235; color: white; min-height: 100vh; padding: 20px; }
        .main { flex: 1; padding: 30px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .btn { padding: 5px 10px; color: white; border: none; cursor: pointer; border-radius: 3px; }
        .ok { background: #27ae60; }
        .no { background: #e74c3c; }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>07 BET</h1>
    <p>Admin Paneli</p>
    <hr>
    <p onclick="location.reload()" style="cursor:pointer;">🔄 Yenile</p>
</div>

<div class="main">
    <div class="box">
        <h2>💰 Bekleyen Ödemeler</h2>
        <div id="deposits"></div>
    </div>
    
    <div class="box">
        <h2>⚽ Aktif Bahisler</h2>
        <div id="bets"></div>
    </div>
</div>

<script type="module">
    import { db, ref, onValue, set, get } from "./firebase-handler.js";

    // Ödemeleri Takip Et
    onValue(ref(db, 'odemeBildirimleri'), (s) => {
        const div = document.getElementById('deposits');
        div.innerHTML = "<table><tr><th>Kullanıcı</th><th>Miktar</th><th>Yöntem</th><th>Onay</th></tr>";
        s.forEach(c => {
            const d = c.val();
            if(d.durum === "Beklemede") {
                div.querySelector('table').innerHTML += `<tr><td>${d.userId}</td><td>${d.miktar} TL</td><td>${d.yontem}</td><td><button class="btn ok" onclick="onay('${c.key}', '${d.userFirebaseKey}', ${d.miktar})">✓</button></td></tr>`;
            }
        });
    });

    window.onay = async (key, uKey, miktar) => {
        const r = ref(db, `kayitlar/${uKey}/balance`);
        const s = await get(r);
        await set(r, (s.val() || 0) + miktar);
        await set(ref(db, `odemeBildirimleri/${key}/durum`), "Onaylandı");
        alert("Bakiye Yüklendi!");
    };
</script>
</body>
</html>
