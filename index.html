<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>07 BET | Profesyonel Platform</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-blue: #2b567e; --bg-gray: #f2f4f7; --success-green: #85b527; --dark-blue: #1b3d5d; }
        body { margin: 0; font-family: 'Roboto', sans-serif; background: var(--bg-gray); color: #333; padding-bottom: 70px; }
        
        /* Header */
        header { background: var(--main-blue); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-style: italic; font-size: 22px; letter-spacing: -1px; }
        .top-btns button { border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .login-btn { background: rgba(255,255,255,0.2); color: white; }
        .reg-btn { background: var(--success-green); color: white; }
        .balance-area { font-weight: bold; color: var(--success-green); font-size: 14px; display: none; }

        /* Banner & Promo */
        .promo-container { display: flex; overflow-x: auto; padding: 15px; gap: 12px; background: white; scrollbar-width: none; }
        .promo-card { min-width: 200px; height: 120px; background: var(--dark-blue); border-radius: 12px; position: relative; overflow: hidden; flex-shrink: 0; }
        .promo-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

        /* Oyun Izgarası */
        .section-title { padding: 10px 15px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; }
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 15px; }
        .game-item { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; cursor: pointer; }
        .game-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
        .game-name { font-size: 10px; text-align: center; padding: 5px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Kayıt Modal */
        .reg-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; flex-direction: column; }
        .reg-header { background: var(--main-blue); color: white; padding: 15px; display: flex; align-items: center; }
        .reg-tabs { display: flex; border-bottom: 1px solid #ddd; }
        .reg-tab { flex: 1; padding: 15px 5px; text-align: center; font-size: 11px; color: #666; }
        .reg-tab.active { color: var(--main-blue); border-bottom: 3px solid var(--main-blue); font-weight: bold; }
        .form-body { padding: 20px; overflow-y: auto; }

        /* Alt Nav */
        nav.bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; height: 60px; }
        .nav-item { flex: 1; text-align: center; padding: 8px 0; color: #555; text-decoration: none; font-size: 10px; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--main-blue); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo">07 BET 🍀</div>
    <div class="balance-area" id="header-balance">0.00 TRY</div>
    <div class="top-btns" id="header-btns">
        <button class="login-btn" onclick="openLogin()">Oturum Aç</button>
        <button class="reg-btn" onclick="toggleReg(true)">Kaydol</button>
    </div>
</header>

<div class="promo-container">
    <div class="promo-card"><img src="https://placehold.co/400x200/1b3d5d/white?text=%25200+HOSGELDIN+BONUSU"></div>
    <div class="promo-card"><img src="https://placehold.co/400x200/2b567e/white?text=HER+GUN+BEDAVA+CARK"></div>
</div>

<div class="section-title"><span>Popüler Slotlar</span> <small style="color:var(--main-blue)">Tümünü gör</small></div>

<div class="game-grid" id="casino-grid">
    </div>

<div class="reg-modal" id="regModal">
    <div class="reg-header">
        <span onclick="toggleReg(false)" style="cursor:pointer; font-size: 20px;">✕</span>
        <span style="margin-left:20px; font-weight: bold;">HIZLI KAYIT</span>
    </div>
    <div class="reg-tabs">
        <div class="reg-tab active">TEK TIKLA</div>
        <div class="reg-tab">TELEFON</div>
        <div class="reg-tab">E-MAIL</div>
    </div>
    <div class="form-body">
        <select id="country"><option value="Türkiye">Türkiye</option></select>
        <select id="currency"><option value="TRY">TRY (Türk Lirası)</option></select>
        <input type="text" id="promo" placeholder="Promosyon kodu (opsiyonel)">
        <select id="bonus-type">
            <option value="Spor">Spor %200 - 8000 TRY'ye kadar</option>
            <option value="Casino">Casino + 1xGames - 45000 TRY</option>
        </select>
        <button class="final-btn" onclick="tekTiklaKayit()">KAYDOL</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="#" class="nav-item active"><i>⚽</i>Spor</a>
    <a href="#" class="nav-item"><i>🎰</i>Casino</a>
    <a href="#" class="nav-item"><i>🎫</i>Kupon</a>
    <a href="profil.html" class="nav-item"><i>👤</i>Profil</a>
    <a href="#" class="nav-item" onclick="adminCheck()"><i>☰</i>Menü</a>
</nav>

<script type="module">
    import { db, ref, push, set, onValue } from "./firebase-handler.js";

    // 1. Oyunları Yükleme
    const slotOyunlari = [
        { id: "vs20olympgate", ad: "Gates of Olympus", resim: "https://static.pragmaticplay.net/game_pic/square/200/vs20olympgate.png" },
        { id: "vs20pbonanza", ad: "Sweet Bonanza", resim: "https://static.pragmaticplay.net/game_pic/square/200/vs20pbonanza.png" },
        { id: "vs20sugarush", ad: "Sugar Rush", resim: "https://static.pragmaticplay.net/game_pic/square/200/vs20sugarush.png" },
        { id: "vs20doghouse", ad: "The Dog House", resim: "https://static.pragmaticplay.net/game_pic/square/200/vs20doghouse.png" },
        { id: "vs20cleocraze", ad: "Cleocatra", resim: "https://static.pragmaticplay.net/game_pic/square/200/vs20cleocraze.png" },
        { id: "vs20starlight", ad: "Starlight Princess", resim: "https://static.pragmaticplay.net/game_pic/square/200/vs20starlight.png" }
    ];

    window.onload = () => {
        const grid = document.getElementById('casino-grid');
        grid.innerHTML = slotOyunlari.map(oyun => `
            <div class="game-item" onclick="slotBaslat('${oyun.id}')">
                <img src="${oyun.resim}">
                <div class="game-name">${oyun.ad}</div>
            </div>
        `).join('');
        checkUserSession();
    };

    // 2. Tek Tıkla Kayıt (Firebase Bağlantılı)
    window.tekTiklaKayit = async () => {
        const userId = Math.floor(100000 + Math.random() * 900000);
        const userPass = "vip" + Math.floor(100 + Math.random() * 899);

        const yeniKayit = {
            userId: userId,
            password: userPass,
            ulke: document.getElementById('country').value,
            para: document.getElementById('currency').value,
            promo: document.getElementById('promo').value || "YOK",
            bonus: document.getElementById('bonus-type').value,
            balance: 50000, // Deneme bakiyesi
            tarih: new Date().toLocaleString('tr-TR'),
            durum: "Aktif"
        };

        try {
            const newUserRef = push(ref(db, 'kayitlar'));
            await set(newUserRef, yeniKayit);
            
            alert(`KAYIT BAŞARILI!\n\nID: ${userId}\nŞifre: ${userPass}\n\nNot: Bu bilgileri not alınız.`);
            localStorage.setItem('currentUser', JSON.stringify({...yeniKayit, firebaseKey: newUserRef.key}));
            window.location.reload();
        } catch (error) {
            alert("Hata: " + error.message);
        }
    };

    // 3. Kullanıcı Oturum Kontrolü
    function checkUserSession() {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (user) {
            document.getElementById('header-btns').style.display = 'none';
            document.getElementById('header-balance').style.display = 'block';
            
            // Bakiyeyi Firebase'den anlık dinle
            onValue(ref(db, `kayitlar/${user.firebaseKey}/balance`), (snap) => {
                document.getElementById('header-balance').innerText = snap.val().toLocaleString() + " TRY";
            });
        }
    }

    // 4. Oyun Başlatma (Demo)
    window.slotBaslat = (id) => {
        if(!localStorage.getItem('currentUser')) return alert("Lütfen önce kaydolun veya giriş yapın!");
        const url = `https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?gameSymbol=${id}&lang=tr&cur=TRY`;
        window.open(url, '_blank', 'width=1000,height=700');
    };

    // Fonksiyonları globale taşı
    window.toggleReg = (show) => document.getElementById('regModal').style.display = show ? 'flex' : 'none';
    window.adminCheck = () => {
        const p = prompt("Yönetici Şifresi:");
        if(p === "0707") window.location.href = "admin-panel.html";
    };
</script>

</body>
</html>
