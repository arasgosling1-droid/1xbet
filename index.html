<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>07 BET | Profesyonel Platform</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-blue: #2b567e; --bg-gray: #f2f4f7; --success-green: #85b527; --dark-blue: #1b3d5d; }
        body { margin: 0; font-family: 'Roboto', sans-serif; background: var(--bg-gray); color: #333; padding-bottom: 70px; }
        
        /* Header */
        header { background: var(--main-blue); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-style: italic; font-size: 22px; }
        .balance-area { font-weight: bold; color: var(--success-green); font-size: 14px; display: none; }
        .top-btns button { border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .login-btn { background: rgba(255,255,255,0.2); color: white; }
        .reg-btn { background: var(--success-green); color: white; }

        /* Banner */
        .promo-container { display: flex; overflow-x: auto; padding: 15px; gap: 12px; background: white; }
        .promo-card { min-width: 250px; height: 130px; background: var(--dark-blue); border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .promo-card img { width: 100%; height: 100%; object-fit: cover; }

        /* Hediye Çarkı Butonu */
        .wheel-trigger { background: linear-gradient(45deg, #f39c12, #d35400); color: white; margin: 10px 15px; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* Oyunlar */
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .game-item { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .game-item img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .game-name { font-size: 10px; text-align: center; padding: 5px; font-weight: bold; }

        /* Modallar (Kayıt ve Çark) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; flex-direction: column; }
        .reg-header { background: var(--main-blue); color: white; padding: 15px; display: flex; align-items: center; }
        .form-body { padding: 20px; flex: 1; overflow-y: auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .final-btn { background: var(--success-green); color: white; border: none; width: 100%; padding: 15px; border-radius: 4px; font-weight: bold; font-size: 16px; margin-top: 15px; }

        /* Çark Modalı Özel */
        #wheel-modal { background: rgba(0,0,0,0.9); justify-content: center; align-items: center; color: white; }

        /* Navigasyon */
        nav.bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; height: 65px; }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; color: #555; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--main-blue); border-top: 2px solid var(--main-blue); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo">07 BET 🍀</div>
    <div class="balance-area" id="header-balance">0.00 TRY</div>
    <div class="top-btns" id="header-btns">
        <button class="login-btn">Giriş</button>
        <button class="reg-btn" onclick="toggleReg(true)">Kaydol</button>
    </div>
</header>

<div class="promo-container">
    <div class="promo-card"><img src="https://placehold.co/400x200/1b3d5d/white?text=%25200+HOSGELDIN"></div>
    <div class="promo-card"><img src="https://placehold.co/400x200/2b567e/white?text=POKER+TOURNAMENT"></div>
</div>

<div class="wheel-trigger" onclick="openWheel()">
    🎡 HEDİYE ÇARKINI ÇEVİR (HER GÜN 1 ŞANS)
</div>

<div class="game-grid" id="casino-grid"></div>

<div class="modal" id="regModal">
    <div class="reg-header">
        <span onclick="toggleReg(false)" style="cursor:pointer; font-size: 24px; margin-right: 15px;">←</span>
        <b>HIZLI KAYIT</b>
    </div>
    <div class="form-body">
        <select id="country"><option>Türkiye</option></select>
        <select id="currency"><option>TRY</option></select>
        <input type="text" id="promo" placeholder="Promosyon Kodu">
        <select id="bonus-type">
            <option>Spor %200 Bonus</option>
            <option>Casino %100 Bonus</option>
        </select>
        <button class="final-btn" onclick="tekTiklaKayit()">KAYDI TAMAMLA</button>
    </div>
</div>

<div class="modal" id="wheel-modal">
    <h2 style="color:#f39c12">GÜNLÜK HEDİYE ÇARKI</h2>
    <div style="position:relative; margin: 20px 0;">
        <div style="position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-top:25px solid #85b527; z-index:10;"></div>
        <canvas id="canvas" width="320" height="320" style="border-radius:50%; border:5px solid #fff; transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);"></canvas>
    </div>
    <button id="spin-btn" class="final-btn" style="width:200px" onclick="startSpin()">ÇEVİR</button>
    <p onclick="closeWheel()" style="margin-top:20px; cursor:pointer; opacity:0.5;">Kapat</p>
</div>

<nav class="bottom-nav">
    <a href="#" class="nav-item active">🏆<br>Spor</a>
    <a href="#" class="nav-item">🎰<br>Casino</a>
    <a href="#" class="nav-item">🎫<br>Kupon</a>
    <a href="#" class="nav-item">👤<br>Profil</a>
    <a href="#" class="nav-item" onclick="adminCheck()">☰<br>Menü</a>
</nav>

<script type="module">
    import { db, ref, push, set, onValue, get } from "./firebase-handler.js";

    // --- OYUNLARI YÜKLE ---
    const oyunlar = [
        { id: "vs20olympgate", ad: "Gates of Olympus" },
        { id: "vs20pbonanza", ad: "Sweet Bonanza" },
        { id: "vs20sugarush", ad: "Sugar Rush" },
        { id: "vs20starlight", ad: "Starlight Princess" },
        { id: "vs20doghouse", ad: "The Dog House" },
        { id: "vs20cleocraze", ad: "Cleocatra" }
    ];

    window.onload = () => {
        const grid = document.getElementById('casino-grid');
        grid.innerHTML = oyunlar.map(o => `
            <div class="game-item" onclick="slotBaslat('${o.id}')">
                <img src="https://static.pragmaticplay.net/game_pic/square/200/${o.id}.png">
                <div class="game-name">${o.ad}</div>
            </div>
        `).join('');
        checkUser();
    };

    // --- KAYIT SİSTEMİ ---
    window.tekTiklaKayit = async () => {
        const id = Math.floor(100000 + Math.random() * 900000);
        const pass = "vip" + Math.floor(100 + Math.random() * 899);
        const user = {
            userId: id, password: pass, balance: 50000, 
            tarih: new Date().toLocaleString('tr-TR'), durum: "Aktif"
        };

        try {
            const res = push(ref(db, 'kayitlar'));
            await set(res, user);
            alert(`KAYIT BAŞARILI!\nID: ${id}\nŞifre: ${pass}`);
            localStorage.setItem('currentUser', JSON.stringify({...user, firebaseKey: res.key}));
            window.location.reload();
        } catch (e) { alert(e.message); }
    };

    function checkUser() {
        const u = JSON.parse(localStorage.getItem('currentUser'));
        if(u) {
            document.getElementById('header-btns').style.display = 'none';
            document.getElementById('header-balance').style.display = 'block';
            onValue(ref(db, `kayitlar/${u.firebaseKey}/balance`), (s) => {
                document.getElementById('header-balance').innerText = s.val().toLocaleString() + " TRY";
            });
        }
    }

    // --- ÇARKIFELEK SİSTEMİ ---
    const prizes = [
        { text: "50 TRY", val: 50, col: "#1b3d5d" },
        { text: "100 TRY", val: 100, col: "#2b567e" },
        { text: "PAS", val: 0, col: "#e74c3c" },
        { text: "250 TRY", val: 250, col: "#2b567e" },
        { text: "50 TRY", val: 50, col: "#1b3d5d" },
        { text: "500 TRY", val: 500, col: "#85b527" },
        { text: "TEKRAR", val: 0, col: "#1b3d5d" },
        { text: "100 TRY", val: 100, col: "#2b567e" }
    ];

    window.drawWheel = () => {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const arc = Math.PI / (prizes.length / 2);
        prizes.forEach((p, i) => {
            const ang = i * arc;
            ctx.fillStyle = p.col;
            ctx.beginPath(); ctx.arc(160, 160, 160, ang, ang + arc); ctx.lineTo(160, 160); ctx.fill();
            ctx.save(); ctx.translate(160 + Math.cos(ang+arc/2)*100, 160 + Math.sin(ang+arc/2)*100);
            ctx.rotate(ang + arc/2 + Math.PI/2); ctx.fillStyle = "white";
            ctx.fillText(p.text, -ctx.measureText(p.text).width/2, 0); ctx.restore();
        });
    };

    window.startSpin = async () => {
        const u = JSON.parse(localStorage.getItem('currentUser'));
        if(!u) return alert("Giriş yapmalısın!");
        document.getElementById("spin-btn").disabled = true;
        const deg = Math.floor(3000 + Math.random() * 3000);
        document.getElementById("canvas").style.transform = `rotate(${deg}deg)`;

        setTimeout(async () => {
            const actual = deg % 360;
            const idx = Math.floor((360 - actual) / (360/prizes.length)) % prizes.length;
            const win = prizes[idx];
            if(win.val > 0) {
                const r = ref(db, `kayitlar/${u.firebaseKey}/balance`);
                const snap = await get(r);
                await set(r, (snap.val() || 0) + win.val);
                alert(`🎉 ${win.val} TRY Kazandın!`);
            } else { alert("Maalesef!"); }
            closeWheel();
            document.getElementById("spin-btn").disabled = false;
        }, 5000);
    };

    // Global erişimler
    window.openWheel = () => { document.getElementById("wheel-modal").style.display="flex"; window.drawWheel(); };
    window.closeWheel = () => document.getElementById("wheel-modal").style.display="none";
    window.toggleReg = (s) => document.getElementById("regModal").style.display = s ? "flex":"none";
    window.slotBaslat = (id) => {
        if(!localStorage.getItem('currentUser')) return alert("Giriş yap!");
        window.open(`https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?gameSymbol=${id}&lang=tr&cur=TRY`);
    };
    window.adminCheck = () => { if(prompt("Şifre:")==="0707") window.location.href="admin-panel.html"; };
</script>
</body>
</html>
