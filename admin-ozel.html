<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>07 BET | Canlı Yönetim Paneli</title>
    <style>
        body { background: #0b1622; color: #fff; font-family: sans-serif; padding: 20px; }
        .log-card { background: #1b3d5d; padding: 15px; margin-bottom: 10px; border-left: 5px solid #85b527; border-radius: 5px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } }
        .status { color: #85b527; font-weight: bold; }
    </style>
</head>
<body>
    <h1>👑 Canlı Kayıt Akışı</h1>
    <div id="logsContainer">Veriler yükleniyor...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // BURAYA KENDİ FİRREBASE YAPILANDIRMANI YAPIŞTIR
        const firebaseConfig = { 
            apiKey: "SENİN_API_KEY",
            databaseURL: "https://SENİN_DB_URL.firebaseio.com",
            projectId: "SENİN_PROJECT_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const logsRef = ref(db, 'kayitlar');

        // VERİLERİ ANLIK DİNLE
        onValue(logsRef, (snapshot) => {
            const container = document.getElementById('logsContainer');
            container.innerHTML = "";
            const data = snapshot.val();
            
            if (data) {
                Object.values(data).reverse().forEach(user => {
                    container.innerHTML += `
                        <div class="log-card">
                            <strong>🕒 ${user.tarih}</strong> | <span class="status">Yeni Kayıt</span><br>
                            📍 Ülke: ${user.ulke} | 💰 Para: ${user.para}<br>
                            🎁 Bonus: ${user.bonus} | 🔑 Promo: ${user.promo || 'Yok'}
                        </div>`;
                });
            } else { container.innerHTML = "Henüz kayıt yok."; }
        });
    </script>
</body>
</html>
